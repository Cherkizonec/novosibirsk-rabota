<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — РаботаНСК</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#19b85b">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#202326;min-height:100vh;display:grid;place-items:center}
    .wrap{width:min(760px,calc(100% - 30px));background:#fff;border-radius:34px;padding:55px;box-shadow:0 18px 60px rgba(20,25,30,.08)}
    .code{font-size:90px;font-weight:950;letter-spacing:-6px;color:#19b85b;line-height:.9}
    h1{font-size:40px;letter-spacing:-1.8px;margin:20px 0 12px}
    p{font-size:17px;line-height:1.6;color:#687078;margin:0 0 28px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    a{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 20px;border-radius:14px;text-decoration:none;font-weight:900}
    .main{background:#17191b;color:#fff}
    .alt{background:#e8fbdc;color:#17351f}
    .logo{margin-bottom:36px;font-weight:950;font-size:23px} .logo span{color:#19b85b}
    @media(max-width:600px){.wrap{padding:32px 23px}.code{font-size:70px}h1{font-size:32px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">Работа<span>НСК</span></div>
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес изменился или в ссылке есть ошибка. Вернитесь на главную или посмотрите основные направления работы в Новосибирске.</p>
    <div class="actions">
      <a class="main" href="https://cherkizonec.github.io/novosibirsk-rabota/">На главную</a>
      <a class="alt" href="https://cherkizonec.github.io/novosibirsk-rabota/podrabotka/">Подработка</a>
      <a class="alt" href="https://cherkizonec.github.io/novosibirsk-rabota/rabota-bez-opyta/">Без опыта</a>
    </div>
  </main>
</body>
</html>
